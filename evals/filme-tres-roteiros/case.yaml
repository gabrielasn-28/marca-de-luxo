schema_version: "1.1"
name: filme-tres-roteiros
expected_outcome: |
  A execução lê o módulo de vídeo e o material da Ganesh na skill e propõe
  três roteiros diferentes, só em palavras, cada um com os cinco atos da
  estrutura do site (abertura, momento principal, prova real, produto em uso,
  assinatura), e pede para escolher um antes de escrever o SPEC ou renderizar.
  Respeita 16:9, 1920x1080, 30 fps.
