<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
    <style>
      @font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400 900;font-display:block;src:url('assets/fonts/BodoniModa.woff2') format('woff2')}
      @font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400 900;font-display:block;src:url('assets/fonts/BodoniModa-Italic.woff2') format('woff2')}
      @font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:block;src:url('assets/fonts/Jost.woff2') format('woff2')}
      :root {
        --ground: #120F0C;
        --ink: #F1EBE0;
        --ouro: #8F7749;
        --champanhe: #D6C190;
        --font-display: 'Bodoni Moda', Georgia, serif;
        --font-body: 'Jost', Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
    </style>
    <script>
      /* Garrafa 3D da marca (a mesma do site), desenhada sob demanda a partir de um estado.
         Determinística: cada quadro depende só do estado passado a render(). */
      window.GaneshGarrafa = function (canvas) {
        const THREE = window.THREE;
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        const scene = new THREE.Scene();
        const pm = new THREE.PMREMGenerator(renderer);
        const env = new THREE.RoomEnvironment();
        [[-2.5, 0xffffff], [3, 0xffe7b8]].forEach(([x, c]) => {
          const f = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 14), new THREE.MeshBasicMaterial({ color: c }));
          f.position.set(x, 0, 7); f.lookAt(0, 0, 0); env.add(f);
        });
        scene.environment = pm.fromScene(env, 0.02).texture;
        const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 100);
        camera.position.set(0, 0, 16);
        const perfil = [[0,0],[.96,0],[1,.06],[1,3.15],[.98,3.45],[.88,3.78],[.66,4.1],[.42,4.38],[.35,4.6],[.34,5.2],[.37,5.24],[.37,5.4],[.33,5.44],[0,5.44]].map(p => new THREE.Vector2(p[0], p[1]));
        const vidro = new THREE.MeshStandardMaterial({ color: 0x020302, roughness: 0.05, metalness: 0.35, envMapIntensity: 1.5 });
        const garrafa = new THREE.Group();
        garrafa.add(new THREE.Mesh(new THREE.LatheGeometry(perfil, 96), vidro));
        const ouro = new THREE.MeshStandardMaterial({ color: 0xB59456, metalness: 1, roughness: 0.28, envMapIntensity: 1.2 });
        const capsula = new THREE.Mesh(new THREE.CylinderGeometry(0.385, 0.36, 0.95, 64), ouro);
        capsula.position.y = 5.0; garrafa.add(capsula);
        [1.25, 2.95].forEach(y => { const a = new THREE.Mesh(new THREE.TorusGeometry(1.004, 0.012, 8, 128), ouro); a.rotation.x = Math.PI / 2; a.position.y = y; garrafa.add(a); });
        garrafa.position.y = -2.72;
        const pivo = new THREE.Group(); pivo.add(garrafa); scene.add(pivo);
        const key = new THREE.SpotLight(0xffe2b0, 60, 40, 0.5, 0.6); key.position.set(4, 7, 8); scene.add(key);
        const rim = new THREE.DirectionalLight(0xd6c190, 2.2); rim.position.set(-6, 3, -5); scene.add(rim);
        const rim2 = new THREE.DirectionalLight(0xffffff, 1.2); rim2.position.set(6, 2, -4); scene.add(rim2);
        scene.add(new THREE.AmbientLight(0x3a2e20, 0.6));
        let ultimo = { x: 0, y: 0, rz: 0, giro: 0, s: 1, op: 1, luz: 4 };
        function render(st) {
          if (st) ultimo = st;
          key.position.x = (ultimo.luz === undefined) ? 4 : ultimo.luz;
          pivo.position.set(ultimo.x, ultimo.y, 0);
          pivo.scale.setScalar(ultimo.s);
          pivo.rotation.z = ultimo.rz;
          garrafa.rotation.y = ultimo.giro;
          canvas.style.opacity = ultimo.op;
          renderer.render(scene, camera);
        }
        const pronto = new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const x = c.getContext('2d'); const h = 360, w = h * 138 / 168;
            x.drawImage(img, 256 - w / 2, 256 - h / 2, w, h);
            const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
            const selo = new THREE.Mesh(new THREE.CylinderGeometry(1.006, 1.006, 1.5, 64, 1, true, -0.745, 1.49),
              new THREE.MeshStandardMaterial({ map: tex, transparent: true, metalness: 0.7, roughness: 0.32, color: 0xffe7b0, emissive: 0x8f7749, emissiveMap: tex, emissiveIntensity: 0.55, envMapIntensity: 1.6 }));
            selo.position.y = 2.1; garrafa.add(selo);
            render(); resolve();
          };
          img.onerror = () => { render(); resolve(); };
          img.src = 'assets/img/ganesh-simbolo-dourado.svg';
        });
        return { render, pronto };
      };
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42" data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="abertura" class="clip" data-composition-id="abertura" data-composition-src="compositions/abertura.html" data-start="0" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="viagem" class="clip" data-composition-id="viagem" data-composition-src="compositions/viagem.html" data-start="6.2" data-duration="18" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="gondola" class="clip" data-composition-id="gondola" data-composition-src="compositions/gondola.html" data-start="24.2" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="taca" class="clip" data-composition-id="taca" data-composition-src="compositions/taca.html" data-start="30.4" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="assinatura" class="clip" data-composition-id="assinatura" data-composition-src="compositions/assinatura.html" data-start="36.4" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
