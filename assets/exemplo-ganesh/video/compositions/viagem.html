  <script>
    (function () {
      const W = 1920, H = 1080;
      const foco = (px, py, s, ax, ay) => ({ x: ax * W - px * s, y: ay * H - py * s, scale: s });
      const tl = gsap.timeline({ paused: true });
      const rotas = Array.from(document.querySelectorAll('#vg-rotas path'));
      rotas.forEach(r => { r.dataset.len = r.getTotalLength(); r.style.strokeDasharray = r.dataset.len; });
      const trilha = document.getElementById('vg-trilha'), Lt = trilha.getTotalLength();
      trilha.style.strokeDasharray = Lt; trilha.style.strokeDashoffset = Lt;
      const navio = document.getElementById('vg-navio');
      const pts = [0, 0.25, 0.5, 0.75, 1].map(f => trilha.getPointAtLength(f * Lt));
      const palavras = (sel, t) => tl.fromTo(sel, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.07, ease: 'power2.out' }, t);
      const entra = (sel, t) => tl.fromTo(sel, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, t);
      const sai = (sel, t) => tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: 0.18, ease: 'power2.in' }, t);

      // o ouro do elefante cai sobre a carta náutica; os vinhedos acendem
      tl.fromTo('#vg-cam', foco(1040, 178, 3.6, 0.7, 0.42), { ...foco(1040, 178, 2.8, 0.7, 0.42), duration: 1.0, ease: 'expo.out' }, 0);
      tl.fromTo('#vg-ouro', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 0);
      tl.fromTo('#vg-pontos circle', { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: 2.4 }, duration: 0.25, stagger: 0.05, ease: 'back.out(2)' }, 0.15);

      // montagem: a câmera salta de vinhedo em vinhedo, o nome grande sobre cada um
      const regioes = [[1040, 130, '#vg-r1'], [994, 172, '#vg-r2'], [924, 208, '#vg-r3'], [1113, 187, '#vg-r4']];
      regioes.forEach(([px, py, id], i) => {
        const t = 0.95 + i * 0.6;
        tl.to('#vg-cam', { ...foco(px, py, 7.5, 0.62, 0.42), duration: 0.42, ease: 'power3.inOut' }, t);
        tl.fromTo(id, { opacity: 0, filter: 'blur(10px)', scale: 1.08 }, { opacity: 1, filter: 'blur(0px)', scale: 1, duration: 0.22, ease: 'expo.out' }, t + 0.2);
        tl.to(id, { opacity: 0, filter: 'blur(10px)', duration: 0.12, ease: 'power2.in' }, t + 0.5);
      });
      tl.to('#vg-cam', { ...foco(1040, 178, 2.8, 0.7, 0.42), duration: 0.8, ease: 'power3.inOut' }, 3.4);
      tl.to('#vg-nomes', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 3.8);
      entra('#vg-a .n', 3.6); palavras('#vg-a h2 span', 3.7); entra('#vg-a p', 4.3);
      sai('#vg-a', 6.35); tl.to('#vg-nomes', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 6.35);

      // o Atlântico inteiro; as rotas se desenham até Santos
      tl.to('#vg-cam', { ...foco(720, 560, 0.98, 0.6, 0.5), duration: 1.0, ease: 'power2.inOut' }, 6.4);
      tl.fromTo(rotas, { strokeDashoffset: (i, el) => el.dataset.len }, { strokeDashoffset: 0, duration: 1.0, stagger: 0.04, ease: 'power2.inOut' }, 6.6);

      // a câmera segue o navio pela travessia
      const nav = { p: 0 };
      const poe = () => { const pt = trilha.getPointAtLength(nav.p * Lt); navio.setAttribute('cx', pt.x); navio.setAttribute('cy', pt.y); trilha.style.strokeDashoffset = Lt * (1 - nav.p); };
      tl.fromTo('#vg-navio', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'none' }, 7.5);
      tl.fromTo(nav, { p: 0 }, { p: 1, duration: 4.0, ease: 'none', onUpdate: poe }, 7.6);
      const zoom = [1.9, 2.05, 2.1, 2.4];
      for (let k = 1; k <= 4; k++) tl.to('#vg-cam', { ...foco(pts[k].x, pts[k].y, zoom[k - 1], 0.58, 0.48), duration: 1.0, ease: 'none' }, 7.6 + (k - 1));
      entra('#vg-b .n', 8.0); palavras('#vg-b h2 span', 8.1); sai('#vg-b', 11.3);
      tl.to('#vg-navio', { opacity: 0, duration: 0.3, ease: 'none' }, 11.6);

      // chegada ao litoral: a câmera desacelera sobre o Brasil e os portos acendem
      tl.to('#vg-cam', { ...foco(548, 858, 5.2, 0.66, 0.42), duration: 1.2, ease: 'power2.out' }, 11.6);
      tl.to('#vg-rotas, #vg-pontos, #vg-trilha', { opacity: 0.25, duration: 0.6, ease: 'none' }, 12.0);
      tl.fromTo('#vg-brasil', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'none' }, 12.0);
      tl.to('#vg-mundo', { opacity: 0.35, duration: 0.6, ease: 'none' }, 12.0);
      tl.fromTo('.vg-p', { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.12, ease: 'power2.out' }, 12.6);
      entra('#vg-c .n', 12.85); palavras('#vg-c h2 span', 12.95); entra('#vg-c p', 13.6); sai('#vg-c', 16.6);
      tl.fromTo('#vg-anel', { attr: { r: 2 }, opacity: 0.9 }, { attr: { r: 10 }, opacity: 0, duration: 0.9, ease: 'expo.out' }, 15.4);

      // mergulho no Covabra: o elefante dourado nasce do ponto e toma a tela
      tl.to('#vg-veu', { opacity: 0, duration: 0.3, ease: 'none' }, 16.4);
      tl.to('#vg-cam', { ...foco(526, 846, 14, 0.5, 0.5), duration: 1.0, ease: 'power3.in' }, 16.3);
      tl.fromTo('#vg-fim', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'none' }, 17.2);
      tl.fromTo('#vg-elef', { opacity: 0, scale: 0.02 }, { opacity: 1, scale: 7, duration: 0.95, ease: 'power3.in' }, 16.95);

      window.__timelines = window.__timelines || {};
      window.__timelines['viagem'] = tl;
    })();
  </script>
