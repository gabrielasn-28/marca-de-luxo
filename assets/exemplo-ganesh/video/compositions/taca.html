<template>
  <style>
    @font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400 900;font-display:block;src:url('assets/fonts/BodoniModa.woff2') format('woff2')}
    @font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400 900;font-display:block;src:url('assets/fonts/BodoniModa-Italic.woff2') format('woff2')}
    @font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:block;src:url('assets/fonts/Jost.woff2') format('woff2')}
    #root { position: absolute; inset: 0; overflow: hidden; background: #120F0C; }
    #tc-tudo { position: absolute; inset: 0; }
    #tc-luz { position: absolute; inset: 0; background: radial-gradient(ellipse 34% 58% at 52% 52%, #3A3020 0%, rgba(18,15,12,0) 100%); }
    #tc-taca { position: absolute; left: 780px; top: 560px; width: 240px; height: 440px; overflow: visible; transform-origin: 50% 25%; }
    #tc-fio { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #tc-cena { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #tc-txt { position: absolute; left: 120px; top: 170px; width: 640px; color: #F1EBE0; }
    #tc-txt .n { display: block; margin-bottom: 18px; font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 34px; color: #D6C190; }
    #tc-txt h2 { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 400; font-size: 88px; line-height: 1.06; letter-spacing: -0.01em; }
    #tc-txt h2 span { display: inline-block; }
    #tc-mar { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="taca" data-width="1920" data-height="1080">
    <div id="tc-tudo">
      <div id="tc-luz"></div>
      <svg id="tc-taca" viewBox="0 0 120 220" aria-hidden="true">
        <defs><clipPath id="tc-bojo"><path d="M14,8 C10,60 22,104 60,110 C98,104 110,60 106,8 Z"/></clipPath></defs>
        <path id="tc-vinho" clip-path="url(#tc-bojo)" d="M0,112 L120,112 L120,120 L0,120 Z" fill="#5E1A26"/>
        <path id="tc-brilho" clip-path="url(#tc-bojo)" d="M0,112 L120,112" fill="none" stroke="#8E3446" stroke-width="1.2"/>
        <path d="M14,8 C10,60 22,104 60,110 C98,104 110,60 106,8" fill="none" stroke="#D6C190" stroke-width="1.4"/>
        <path d="M60,110 V196 M30,204 C40,197 80,197 90,204" fill="none" stroke="#D6C190" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg id="tc-fio" viewBox="0 0 1920 1080" aria-hidden="true">
        <path id="tc-jato" d="M994,238 C966,350 914,470 900,640" fill="none" stroke="#5E1A26" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <div id="tc-txt">
        <span class="n">Na taça</span>
        <h2><span>E</span> <span>termina</span> <span>na</span> <span>taça</span> <span>de</span> <span>quem</span> <span>prova</span> <span>o</span> <span>seu</span> <span>vinho.</span></h2>
      </div>
    </div>
    <canvas id="tc-cena" width="1920" height="1080"></canvas>
    <svg id="tc-mar" viewBox="0 0 1920 1080" aria-hidden="true">
      <path id="tc-onda" d="M0,1200 L1920,1200 L1920,1300 L0,1300 Z" fill="#5E1A26"/>
    </svg>
  </div>
  <script>
    (function () {
      const g = window.GaneshGarrafa(document.getElementById('tc-cena'));
      const visW = 2 * 16 * Math.tan(15 * Math.PI / 180) * 16 / 9;
      const bx = (1180 / 1920 - 0.5) * visW;
      const S = { x: bx, y: 1.6, rz: 0, giro: -3, s: 0.62, op: 1, luz: 4 };
      const tl = gsap.timeline({ paused: true, onUpdate: () => g.render(S) });
      const jato = document.getElementById('tc-jato'), L = jato.getTotalLength();
      jato.style.strokeDasharray = L; jato.style.strokeDashoffset = L;
      const vinho = document.getElementById('tc-vinho'), brilho = document.getElementById('tc-brilho'), onda = document.getElementById('tc-onda');
      // superfície do vinho: uma onda que depende só do tempo e do nível
      const superficie = (y, amp, fase, x0, x1, passos) => {
        let d = ''; for (let i = 0; i <= passos; i++) { const x = x0 + (x1 - x0) * i / passos; const yy = y + Math.sin(i / passos * Math.PI * 3 + fase) * amp; d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + yy.toFixed(1); } return d;
      };
      const taca = { t: 0 };
      const enche = () => {
        const p = Math.min(1, taca.t / 1.5), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const nivel = 112 - 54 * e, amp = 1.6 * (1 - p * 0.6) + 0.4, fase = taca.t * 5;
        const topo = superficie(nivel, amp, fase, 0, 120, 24);
        vinho.setAttribute('d', topo + 'L120,120 L0,120 Z'); brilho.setAttribute('d', topo);
      };
      const mar = { t: 0 };
      const sobe = () => {
        const p = Math.min(1, mar.t / 1.3), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const nivel = 1140 - 1260 * e, fase = mar.t * 4;
        onda.setAttribute('d', superficie(nivel, 26, fase, -40, 1960, 48) + 'L1960,1200 L-40,1200 Z');
      };

      // chicote de entrada, na mesma velocidade da cena anterior
      tl.fromTo('#tc-tudo, #tc-cena', { x: 1150, filter: 'blur(18px)' }, { x: 0, filter: 'blur(0px)', duration: 0.75, ease: 'power3.out' }, 0);
      tl.fromTo(S, { giro: -3 }, { giro: 0, duration: 1.1, ease: 'power3.out' }, 0);
      // a garrafa se inclina e serve
      tl.to(S, { rz: 1.15, duration: 0.9, ease: 'power2.inOut' }, 0.7);
      tl.fromTo(jato, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.3, ease: 'power1.in' }, 1.5);
      tl.fromTo(taca, { t: 0 }, { t: 2.9, duration: 2.9, ease: 'none', onUpdate: enche }, 1.75);
      tl.to(jato, { strokeDashoffset: -L, duration: 0.3, ease: 'power1.in' }, 3.25);
      tl.to(S, { rz: 0.45, duration: 0.7, ease: 'power2.inOut' }, 3.3);
      tl.fromTo('#tc-txt .n', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, 0.85);
      tl.fromTo('#tc-txt h2 span', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.07, ease: 'power2.out' }, 0.95);
      tl.to('#tc-txt', { opacity: 0, filter: 'blur(8px)', duration: 0.18, ease: 'power2.in' }, 4.45);
      // o vinho transborda e toma a tela
      tl.to('#tc-taca', { scale: 1.6, duration: 1.3, ease: 'power2.in' }, 4.4);
      tl.to(S, { op: 0, duration: 0.4, ease: 'none' }, 4.5);
      tl.fromTo(mar, { t: 0 }, { t: 1.6, duration: 1.6, ease: 'none', onUpdate: sobe }, 4.4);
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady['taca'] = g.pronto;
      g.render(S);
      window.__timelines = window.__timelines || {};
      window.__timelines['taca'] = tl;
    })();
  </script>
</template>
